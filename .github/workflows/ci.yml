name: CI

on:
  pull_request:
    # Skip markdown-only PRs, EXCEPT under kcap/ — every file in the shipped plugin is a SKILL.md, so
    # adding a skill is a markdown-only change. Ignoring those let two skills ship unlisted in
    # AgentsSkillsInstaller.SourceNames without a red build; the guard that now catches it only helps
    # if it runs on the PR that causes it. Order matters: later patterns re-include.
    paths:
      - '**'
      - '!**.md'
      - 'kcap/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64 only. windows-latest is omitted: hosted minutes refuse this org
        # before checkout, so that matrix entry cannot be a gate. macOS is not in
        # this matrix: the unit suite has a known cluster of macOS-local
        # temp-path/parallel-load flakes that would make a macOS leg permanently
        # red. macOS arm64 is covered by maintainer runs; macOS x64 is
        # intentionally untested. Platform-sensitive daemon behavior that must
        # hold everywhere (e.g. the borrowed-review capability advertisement,
        # which no longer carries any OS/arch precondition) is additionally
        # pinned by host-independent source guards in the unit suite — see
        # DaemonRunnerCursorAvailabilityTests' platform coverage matrix.
        include:
          - name: linux-x64
            runner: [self-hosted, moosegoose-build]

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          # The self-hosted runner is not root and cannot write the action's default
          # /usr/share/dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          cache: true
          # No lock file to key on; CPM makes this the one file that pins every version.
          cache-dependency-path: Directory.Packages.props

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Whole solution in every cached job: one OS-keyed immutable entry, so a job that
      # restored a subset would win the race and freeze the cache on it.
      - name: Restore solution
        run: dotnet restore Capacitor.slnx

      - name: Build solution
        run: dotnet build Capacitor.slnx --no-restore

      - name: Run npm wrapper tests
        # Plain-Node assertion scripts for the npm launcher/refresh/resolve
        # modules (no test framework, no npm install). `shell: bash` gives
        # fail-fast -e semantics.
        shell: bash
        run: |
          node npm/kcap/bin/kcap.test.js
          node npm/kcap/bin/resolve.test.js
          node npm/kcap/bin/refresh.test.js

      - name: Run server unit tests
        # Compile/run Capacitor.Server.Data and Capacitor.Server.Ingest unit
        # projects when those csproj files exist on the branch. SqliteDatabaseInitializer
        # walks from the process working directory to Capacitor.slnx, so these
        # tests must start at the repo root rather than the test host's output dir.
        # --maximum-parallel-tests 1 caps TUnit's unkeyed bucket; keyed
        # [NotInParallel] tests still run concurrently with disjoint-key classes.
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          projects=(
            test/Capacitor.Server.Data.Tests.Unit/Capacitor.Server.Data.Tests.Unit.csproj
            test/Capacitor.Server.Ingest.Tests.Unit/Capacitor.Server.Ingest.Tests.Unit.csproj
          )
          found=0
          for proj in "${projects[@]}"; do
            if [[ -f "$proj" ]]; then
              found=1
              echo "Running $proj from ${PWD}"
              dotnet test "$proj" -- --maximum-parallel-tests 1
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo "Server Data/Ingest unit test projects are not on this branch; skipping."
          fi

  lint-linear-ids:
    name: No Linear issue IDs in C# source
    runs-on: [self-hosted, moosegoose-build]
    steps:
      - uses: actions/checkout@v7
      - name: Check for Linear issue ID tokens in src/**/*.cs and test/**/*.cs
        run: bash scripts/check-linear-ids.sh

  aot-check:
    name: AOT publish check
    runs-on: [self-hosted, moosegoose-build]
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Capacitor.Cli/Capacitor.Cli.csproj
          - src/Capacitor.Cli.Daemon/Capacitor.Cli.Daemon.csproj

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          # The self-hosted runner is not root and cannot write the action's default
          # /usr/share/dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          cache: true
          # No lock file to key on; CPM makes this the one file that pins every version.
          cache-dependency-path: Directory.Packages.props

      - name: Install build dependencies
        id: aot-deps
        # ILCompiler shells out to clang and links against zlib, so both must be present before
        # publish. A self-hosted runner account without passwordless sudo cannot install them,
        # and an interactive sudo would hang the job until timeout. Skip AOT rather than fail
        # the Linux compile/test gate when the host has neither the packages nor sudo.
        run: |
          if command -v clang >/dev/null && dpkg -s zlib1g-dev >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::clang and zlib1g-dev are missing and this runner has no passwordless sudo. Skipping AOT publish. Install them on the runner host: sudo apt-get install -y clang zlib1g-dev"

      # Whole solution, and the RID pulls ILCompiler — a superset of build-and-test's set.
      - name: Restore solution
        if: steps.aot-deps.outputs.available == 'true'
        run: dotnet restore Capacitor.slnx -r linux-x64

      - name: Publish AOT (linux-x64)
        if: steps.aot-deps.outputs.available == 'true'
        run: dotnet publish ${{ matrix.project }} -c Release -r linux-x64 --no-restore

      - name: Check for trimming warnings
        if: steps.aot-deps.outputs.available == 'true'
        run: |
          OUTPUT=$(dotnet publish ${{ matrix.project }} -c Release -r linux-x64 --no-restore 2>&1)
          if echo "$OUTPUT" | grep -E 'IL[23][01][0-9]{2}'; then
            echo "::error::AOT/trimming warnings detected"
            echo "$OUTPUT" | grep -E 'IL[23][01][0-9]{2}'
            exit 1
          fi
