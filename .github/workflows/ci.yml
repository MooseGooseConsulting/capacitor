name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (linux-x64)
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, moosegoose-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected checks
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          dotnet=false
          wrapper=false
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            dotnet=true
            wrapper=true
          else
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$changed"
            while IFS= read -r -d '' file; do
              case "$file" in
                .github/workflows/ci.yml|.github/actions/*)
                  dotnet=true; wrapper=true ;;
                src/*|test/*|kcap/*|*.sln|*.slnx|*.props|*.targets|global.json|NuGet.Config|nuget.config|.config/*|.editorconfig|scripts/check-linear-ids.sh)
                  dotnet=true ;;
                npm/*)
                  wrapper=true ;;
              esac
            done < "$changed"
          fi
          printf 'dotnet=%s\nwrapper=%s\n' "$dotnet" "$wrapper" >> "$GITHUB_OUTPUT"
          printf 'Selected checks: dotnet=%s wrapper=%s\n' "$dotnet" "$wrapper" >> "$GITHUB_STEP_SUMMARY"

      - name: Isolate tool caches
        if: steps.changes.outputs.dotnet == 'true' || steps.changes.outputs.wrapper == 'true'
        shell: bash
        run: |
          {
            echo "DOTNET_CLI_HOME=$RUNNER_TEMP/dotnet-cli"
            echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget"
            echo "npm_config_cache=$RUNNER_TEMP/npm"
          } >> "$GITHUB_ENV"

      - name: Setup .NET
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore solution
        if: steps.changes.outputs.dotnet == 'true'
        run: dotnet restore Capacitor.slnx

      - name: Build solution
        if: steps.changes.outputs.dotnet == 'true'
        run: dotnet build Capacitor.slnx --no-restore

      - name: Check source identifiers
        if: steps.changes.outputs.dotnet == 'true'
        run: bash scripts/check-linear-ids.sh

      - name: Run server unit tests
        if: steps.changes.outputs.dotnet == 'true'
        shell: bash
        run: |
          set -uo pipefail
          projects=(
            test/Capacitor.Server.Data.Tests.Unit/Capacitor.Server.Data.Tests.Unit.csproj
            test/Capacitor.Server.Ingest.Tests.Unit/Capacitor.Server.Ingest.Tests.Unit.csproj
          )
          found=0
          failed=0
          for proj in "${projects[@]}"; do
            if [[ -f "$proj" ]]; then
              found=1
              if ! dotnet test "$proj" --no-build -- --maximum-parallel-tests 1; then
                failed=1
              fi
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo 'No server unit-test project exists on this revision.'
          fi
          exit "$failed"

      - name: Setup Node.js
        if: steps.changes.outputs.wrapper == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run npm wrapper tests
        if: steps.changes.outputs.wrapper == 'true'
        shell: bash
        run: |
          node npm/kcap/bin/kcap.test.js
          node npm/kcap/bin/resolve.test.js
          node npm/kcap/bin/refresh.test.js
