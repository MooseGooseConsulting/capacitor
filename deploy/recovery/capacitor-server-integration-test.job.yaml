# Runs the PostgreSQL-backed API integration suite inside Blood Arrow's recovery
# cluster. This is intentionally a finite test Job: it neither creates an API
# Deployment nor exposes a Capacitor Service or Ingress.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: capacitor-server-integration-test-
  namespace: data-platform
  labels:
    app.kubernetes.io/name: capacitor-server-integration-test
    app.kubernetes.io/part-of: capacitor-recovery
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacitor-server-integration-test
    spec:
      restartPolicy: Never
      containers:
        - name: integration-test
          image: mcr.microsoft.com/dotnet/sdk:10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_REF
              value: feature/session-vertical-slice
          volumeMounts:
            - name: database-credentials
              mountPath: /var/run/capacitor-test-db
              readOnly: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              git clone --depth 1 --branch "$GIT_REF" https://github.com/MooseGooseConsulting/capacitor.git /workspace/capacitor
              cd /workspace/capacitor
              db_user=$(tr -d '\r\n' < /var/run/capacitor-test-db/username)
              db_password=$(tr -d '\r\n' < /var/run/capacitor-test-db/password)
              export CAPACITOR_TEST_POSTGRES_CONNECTION_STRING="Host=pg18-core-recovery-rw.data-platform.svc.cluster.local;Port=5432;Database=capacitor_test;Username='$db_user';Password='$db_password';SSL Mode=Disable"
              dotnet test test/Capacitor.Server.Api.Tests.Integration/Capacitor.Server.Api.Tests.Integration.csproj --no-logo --verbosity normal
      volumes:
        - name: database-credentials
          secret:
            secretName: capacitor-test-db-credentials
